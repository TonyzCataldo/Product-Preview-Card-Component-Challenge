<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link rel="stylesheet" href="estilo.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body>
  <div class="all">
    <main class="main">
      <div class="imagem"><picture>
        <source srcset="images/image-product-desktop.jpg" media="(min-width: 768px)">

      <section>

      <div class="inline"><h2 class="preco">$149.99</h2> <p class="preco2">$169.99</p></div>
      <p class="btn"><img class="carrinho" style="margin-right: 0.7rem; font-weight: 700;" src="images/icon-cart.svg" alt="ícone"> Add to Cart</p>
      </section>
    </main>
